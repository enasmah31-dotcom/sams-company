name: Sams Company Daily Workflow

on:
  schedule:
    # 11:00 UTC = 1:00 PM Libya Time
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  run-company-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          find . -name "requirements.txt" -exec pip install -r {} \;

      - name: Execute Sams Company Core Process
        env:
          GROQ_API_KEY: ${{ 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 }}
          YOUTUBE_API_KEY: ${{ AIzaSyDndq5WTE50Zx5c519AbERyf7hptPjp7SM }}
          YOUTUBE_CHANNEL_ID: ${{ UCbB1oWEzD0R8eRN_q5FlebA }}
          GMAIL_USER: ${{ vibng.me@gmail.com }}
          GMAIL_APP_PASSWORD: ${{ gbvv nhqn wrxq lijf }}
          TARGET_EMAIL: ${{ hitc.ads@gmail.com }}
        run: |
          # البحث عن ملف run_all.py وتشغيله من مكانه الفعلي تلقائيًا
          TARGET_FILE=$(find . -name "run_all.py" -print -quit)
          if [ -n "$TARGET_FILE" ]; then
            cd $(dirname "$TARGET_FILE")
            python run_all.py
          else
            echo "Error: run_all.py not found!"
            exit 1
          fi

      - name: Commit and Push Updated Status Data
        run: |
          git config --global user.name "Sams Company Bot"
          git config --global user.email "bot@samscompany.local"
          git add .
          git commit -m "Auto-update status and daily reports" || exit 0
          git push
